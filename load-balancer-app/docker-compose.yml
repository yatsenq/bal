version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: load_balancer_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"  
    networks:
      - app_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres
    networks:
      - app_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_queue
    ports:
      - '6379:6379'
    networks:
      - app_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker1:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker_server_1
    environment:
      - NODE_ENV=production
      - PORT=3001
      - WORKER_ID=worker-1
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/load_balancer_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=MmLun3Bd8IPqKilebjXEToy4CGOwt5pAZk69z1SrsVDYQ2UJFcv0hgfaxW7NHR
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  worker2:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker_server_2
    environment:
      - NODE_ENV=production
      - PORT=3002
      - WORKER_ID=worker-2
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/load_balancer_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=MmLun3Bd8IPqKilebjXEToy4CGOwt5pAZk69z1SrsVDYQ2UJFcv0hgfaxW7NHR
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx_load_balancer
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '443:443'
      - '80:80'
    depends_on:
      - worker1
      - worker2
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    ports:
      - '3000:80'
    depends_on:
      - nginx
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
